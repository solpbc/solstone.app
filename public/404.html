<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>page not found — solstone</title>
    <link rel="icon" type="image/svg+xml" href="/static/sol-ring-icon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="/static/tokens.css">
    <style>
        /* Comfortaa loads via tokens.css (linked above) — no per-page @font-face. */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: var(--font-body);
            background: var(--cream);
        }
        h1 {
            font-family: var(--font-display);
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: lowercase;
            color: var(--ink);
            margin-bottom: 1.5rem;
        }
        .logo {
            height: 40px;
            margin-bottom: 2rem;
        }
        a {
            text-decoration: none;
        }
        .message {
            max-width: 500px;
            width: 90vw;
            font-size: 1rem;
            line-height: 1.6;
            color: var(--ink-soft);
            text-align: center;
            margin-bottom: 2rem;
        }
        .links {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .links a {
            display: block;
            color: var(--ink-faint);
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
            transition: color 0.15s;
        }
        .links a:hover {
            color: var(--orange-ink);
            text-decoration: none;
        }
        footer {
            margin-top: auto;
            padding: 2rem 0;
            font-family: var(--font-display);
            font-size: 0.85rem;
            color: var(--ink-faint);
        }
        footer a {
            color: var(--ink-faint);
        }
        footer a:hover {
            text-decoration: underline;
        }
        /* --- accessibility --- */
        .skip-link {
            position: absolute;
            top: -3rem;
            left: 0.5rem;
            z-index: 1000;
            background: var(--ink);
            color: var(--ink-on-dark);
            font-family: var(--font-display);
            font-size: 0.9rem;
            padding: 0.6rem 1rem;
            border-radius: 0 0 6px 6px;
            text-decoration: none;
            transition: top 0.15s;
        }
        .skip-link:focus {
            top: 0;
        }
        :focus-visible {
            outline: 2px solid var(--focus);
            outline-offset: 2px;
        }
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        main:focus {
            outline: none;
        }
    </style>
</head>
<body>
    <a href="#main" class="skip-link">skip to content</a>
    <header>
        <a href="/"><img src="/static/sol-wordmark.svg" alt="solstone" class="logo"></a>
    </header>
    <main id="main" tabindex="-1">
        <h1>page not found.</h1>
        <p class="message">this page doesn't exist. here are some places that do:</p>
        <nav class="links" aria-label="helpful links">
            <a href="/install">get started &rarr;</a>
            <a href="/observers">browse observers &rarr;</a>
            <a href="https://github.com/solpbc/solstone">source code on github &rarr;</a>
            <a href="/">back to solstone.app &rarr;</a>
        </nav>
    </main>
    <footer>&copy; 2026 <a href="https://solpbc.org">sol pbc</a> &middot; your data stays on your device — never sold, never shared. solstone is a trademark of sol pbc.</footer>
</body>
</html>
