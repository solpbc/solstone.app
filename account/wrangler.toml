name = "account-portal"
account_id = "3f2c1528c7d4d9685819ea9e9e307c92"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
main = "src/index.js"

routes = [{ pattern = "account.solstone.app", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "account-portal"
database_id = "5ab8e5a8-685c-4f20-9169-047d2778fa73"
migrations_dir = "migrations"

# Replace this placeholder with the real namespace id from
# `wrangler kv namespace create GCP_TOKEN_CACHE` during deploy provisioning.
[[kv_namespaces]]
binding = "GCP_TOKEN_CACHE"
id = "PLACEHOLDER_BIND_AT_DEPLOY"

[[send_email]]
name = "EMAIL"
remote = true

[vars]
TURNSTILE_SITE_KEY = "0x4AAAAAADPn7-wnLZnFjshK"
CF_ACCESS_AUD = "a48343311f9157cfb056e5aa70878dc8aab4962769a8e1743486b6a884054104"
EMAIL_PATH_DISABLED = "false"
SIGNUP_DISABLED = "false"

[triggers]
crons = ["0 */6 * * *"]
