name = "account-portal"
account_id = "3f2c1528c7d4d9685819ea9e9e307c92"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
main = "src/index.js"

routes = [{ pattern = "account.solstone.app", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "account-portal"
database_id = "5ab8e5a8-685c-4f20-9169-047d2778fa73"
migrations_dir = "migrations"

# Replace this placeholder with the real namespace id from
# `wrangler kv namespace create GCP_TOKEN_CACHE` during deploy provisioning.
[[kv_namespaces]]
binding = "GCP_TOKEN_CACHE"
id = "9707e650b35847f5aaf180ae0164e90b"

# APNs push dispatch secrets (set via `wrangler secret put`):
# APNS_TEAM_ID — Apple Developer Team ID (used as JWT issuer).
# APNS_KEY_ID — Apple APNs auth key id (scopes the KV JWT cache key).
# APNS_P8_PEM — APNs Auth Key .p8 private key PEM contents.
# APNS_BUNDLE_ID — App bundle id used as apns-topic (e.g. app.solstone.swift).
# APNS_ENV — APNs environment: "production" or "sandbox".

[[send_email]]
name = "EMAIL"
remote = true

[vars]
TURNSTILE_SITE_KEY = "0x4AAAAAADPn7-wnLZnFjshK"
CF_ACCESS_AUD = "a48343311f9157cfb056e5aa70878dc8aab4962769a8e1743486b6a884054104"
EMAIL_PATH_DISABLED = "false"
SIGNUP_DISABLED = "false"

[triggers]
crons = ["0 */6 * * *"]
