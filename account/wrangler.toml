name = "account-portal"
account_id = "3f2c1528c7d4d9685819ea9e9e307c92"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
main = "src/index.js"

# Disable the *.workers.dev preview URL: a live workers.dev hostname bypasses the
# custom domain's edge CF Access on /admin/*, leaving only the in-worker JWT check
# (one layer instead of two). The portal is reached only via the custom domain.
# (CSO audit F5.)
workers_dev = false

routes = [{ pattern = "services.solstone.app", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "account-portal"
database_id = "5ab8e5a8-685c-4f20-9169-047d2778fa73"
migrations_dir = "migrations"

# Replace this placeholder with the real namespace id from
# `wrangler kv namespace create GCP_TOKEN_CACHE` during deploy provisioning.
[[kv_namespaces]]
binding = "GCP_TOKEN_CACHE"
id = "9707e650b35847f5aaf180ae0164e90b"

# Internal service binding to the extro-support worker.
[[services]]
binding = "SUPPORT_WORKER"
service = "extro-support"

# Internal service binding to the spl-relay worker. The account->relay entitlement
# grant push (relay-grant.js pushEntitlementGrant) routes worker-to-worker over
# this binding instead of the public internet. The relay still exposes its
# Bearer-gated /admin/entitlement endpoint for self-hosters and the operator CLI;
# the binding only removes the public hop for our own prod money path. Absent the
# binding, pushEntitlementGrant falls back to a public fetch of RELAY_GRANT_URL.
[[services]]
binding = "RELAY"
service = "spl-relay"

# Support service auth secret (set via `wrangler secret put`):
# SERVICES_AUTH_TOKEN — shared secret sent to the support worker on internal requests.
#
# Impersonation allowlist (set transiently via `wrangler secret put`):
# IMPERSONATE_ALLOWED — comma-separated account UUIDs permitted as POST /admin/impersonate targets.
#   Unset/empty = impersonation disabled (default; no account can be impersonated, even with a valid CF Access token).
#   Provision only for a specific test run (`wrangler secret put IMPERSONATE_ALLOWED`) and remove it after
#   (`wrangler secret delete IMPERSONATE_ALLOWED`). No default; never a [vars] entry; never hardcode account ids.

# APNs push dispatch secrets (set via `wrangler secret put`):
# APNS_TEAM_ID — Apple Developer Team ID (used as JWT issuer).
# APNS_KEY_ID — Apple APNs auth key id (scopes the KV JWT cache key).
# APNS_KEY_P8 — APNs Auth Key .p8 private key PEM contents.
# APNS_BUNDLE_ID — App bundle id used as apns-topic (e.g. app.solstone.swift).
# APNS_ENV — APNs environment: "production" or "sandbox".
# REACH_RELAY_TOKEN_SECRET — HS256 signing secret for minted 24h reach relay tokens (POST /reach/push/relay-token).
#
# Optional Scout Gemini key project override:
# SCOUT_GCP_PROJECT — GCP project id for newly provisioned Scout API keys.
# Leave unset to use the service account project_id.
#
# Stripe billing secrets (set via `wrangler secret put`):
# STRIPE_SECRET_KEY — Stripe restricted secret key for Checkout, Portal, and subscription reads.
# STRIPE_WEBHOOK_SECRET — Stripe webhook endpoint signing secret.
# Create the Stripe webhook endpoint on API version 2024-09-30.acacia.
#
# Relay grant:
# RELAY_GRANT_SECRET — shared secret for relay grant calls, set via `wrangler secret put`.
# RELAY_GRANT_URL — relay grant endpoint URL, without a trailing slash.
# RELAY_GRACE_DAYS — billing grace window for relay grants.
#
# Security audit sink (set via `wrangler secret put`):
# HUB_WEBHOOK_URL — extro-hub webhook ingress for durable T4 security events
#   (e.g. https://extro.solpbc.org/hooks/security). T4 handlers POST typed events
#   here so the audit trail is durable + alerting, not just an ephemeral
#   console.warn. Unset = no-op (the console.warn breadcrumb still fires).
#   NEVER carries raw tokens, credentials, or other secret material.
# HUB_WEBHOOK_SECRET — shared X-Hub-Secret bearer for the hub webhook ingress.
#
# SPB R2 credential broker secrets (set via `wrangler secret put`):
# R2_PARENT_ACCESS_KEY_ID — parent R2 S3 access key id used as the minted access_key_id.
# R2_PARENT_SECRET_ACCESS_KEY — parent R2 S3 secret access key used only as the HS256 signing key;
#   never returned or logged.
# SPB_MINT_ENABLED — broker kill-switch. Leave UNSET in prod (default-off) until spike S1
#   passes, then set to "true".
# SPB_SWEEP_ENABLED — lapse-retention sweep kill-switch. Leave UNSET in prod (default-off)
#   until the real-R2 sweep spike passes, then set to "true". The daily 0 3 * * * cron
#   self-mints a maintenance-scoped temp credential per binding; the parent R2 secret stays
#   signing-key-only and is never used directly against objects.

[[send_email]]
name = "EMAIL"
remote = true

[vars]
TURNSTILE_SITE_KEY = "0x4AAAAAADPn7-wnLZnFjshK"
CF_ACCESS_AUD = "a48343311f9157cfb056e5aa70878dc8aab4962769a8e1743486b6a884054104"
EMAIL_PATH_DISABLED = "false"
SIGNUP_DISABLED = "false"
SCOUT_GCP_PROJECT = "solstone-scouts"
STRIPE_PRICE_ANNUAL = "price_1TjnJB3ew4P2jFrx820NPkX4"
STRIPE_PRICE_MONTHLY = "price_1TjnJC3ew4P2jFrxANwt3ya8"
STRIPE_PRICE_SPB_ANNUAL = "price_1TlGmO3ew4P2jFrxThHBPMB7"
STRIPE_PRICE_SPB_MONTHLY = "price_1TlGmO3ew4P2jFrxg0DylUaz"
RELAY_GRANT_URL = "https://link.solstone.app"
RELAY_GRACE_DAYS = "14"
R2_ACCOUNT_ID = "3f2c1528c7d4d9685819ea9e9e307c92"
R2_BUCKET = "solstone-backups"
# spb operated tier LAUNCHED 2026-06-23 (operator go): broker minting + the 30-day
# lapse sweep are live. Set to anything other than "true" to dark-disable instantly.
SPB_MINT_ENABLED = "true"
SPB_SWEEP_ENABLED = "true"
# spp confidential-processing (scout alpha). SPP_ENGINE_ENDPOINT points at the live
# persistent CC-H100 engine's RA-TLS gateway (confirmed 2026-07-21):
# processing.solstone.app (DNS-only A -> static 68.220.169.29) :9443. The explicit port
# is required — the journal defaults a portless https URL to 443, where nothing listens.
# The portal hands this to the device over the local handoff; it never calls it itself.
# Non-secret config only.
# SPP_ENGINE_AUTH_SECRET authenticates the engine gateway to the content-free
# /internal/spp/authorize endpoint. Provision with `wrangler secret put`; never put it here.
SPP_ENGINE_ENDPOINT = "https://processing.solstone.app:9443"
SPP_ENGINE_MODEL = "Qwen/Qwen3.5-4B"

[triggers]
crons = ["0 */6 * * *", "0 3 * * *"]
