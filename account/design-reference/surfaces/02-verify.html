<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>verify your code</title>
<link rel="stylesheet" href="portal.css">
</head>
<body><main>

  <div class="brandbar">
    <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="#E8923A" stroke-width="1.6">
      <circle cx="12" cy="12" r="4.2" fill="#E8923A" stroke="none"/>
      <g stroke-linecap="round"><path d="M12 2.6v2.3M12 19.1v2.3M2.6 12h2.3M19.1 12h2.3M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"/></g>
    </svg>
    <span class="wordmark">solstone</span>
  </div>

  <h1>verify your code</h1>
  <p class="lead">code sent to <strong>jeremie@solpbc.org</strong>. it expires 10 minutes after we sent it.</p>

  <div class="card">
    <form method="post" action="/signin/verify">
      <label for="code">6-digit code</label>
      <input id="code" class="code" name="code" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" autofocus required maxlength="6" placeholder="······">
      <button class="btn primary block" type="submit">verify</button>
    </form>
  </div>

  <p class="disclosure">didn't get it? <a href="/">request a new code</a>.</p>

</main></body>
</html>
